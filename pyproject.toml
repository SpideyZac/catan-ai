[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "catan-ai"
description = "Settlers of Catan AI with player-to-player trading: Rust engine, PyTorch agents, multiplayer web app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Neural agents (training and inference). Install with: uv sync --extra train
# (PyPI torch: CPU-only on Windows/macOS, CUDA on Linux).
train = [
    "torch>=2.4",
    "tensorboard>=2.17",
]
# Optionally pin the torch build flavour from the official PyTorch index:
#   uv sync --extra train --extra cu130   # CUDA 13.0 (e.g. NVIDIA GPU on Windows)
#   uv sync --extra train --extra cpu     # CPU-only wheels (smaller download on Linux)
cpu = [
    "torch>=2.4",
]
cu130 = [
    "torch>=2.4",
]

[project.scripts]
catan-train = "catan_ai.train:main"
catan-eval = "catan_ai.evaluate:main"
catan-server = "catan_ai.server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "maturin>=1.8,<2",
]

[tool.maturin]
python-source = "python"
module-name = "catan_ai._engine"
manifest-path = "crates/catan-py/Cargo.toml"
features = ["pyo3/extension-module"]
profile = "release"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]
# Rebuild the Rust extension whenever engine sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "SIM115"]
